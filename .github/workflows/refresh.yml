name: Refresh feeds

on:
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch: {} # "Run workflow" button
  push:
    paths:
      - feeds.config.json
      - scripts/**

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node scripts/fetch-feeds.js
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain feeds.json)" ]; then
            git config user.name "feed-bot"
            git config user.email "feed-bot@users.noreply.github.com"
            git add feeds.json
            git commit -m "Update feeds"
            git push
          else
            echo "feeds.json unchanged"
          fi
