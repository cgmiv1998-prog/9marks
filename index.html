<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>9Marks</title>
  <meta name="theme-color" content="#0e0f12">
  <meta name="description" content="9Marks podcasts. Nothing else.">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="9Marks">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>9Marks</h1>
    <span id="updated" class="muted"></span>
  </header>

  <nav id="chips" class="chips" aria-label="Shows"></nav>

  <main id="list" class="list" aria-live="polite">
    <p class="muted pad">Loading…</p>
  </main>

  <section id="player" class="player" hidden>
    <div class="now">
      <img id="art" alt="" width="48" height="48">
      <div class="meta">
        <div id="title" class="title"></div>
        <div id="show" class="muted small"></div>
      </div>
    </div>

    <div class="scrub">
      <span id="cur" class="time">0:00</span>
      <input id="seek" type="range" min="0" max="1" step="1" value="0" aria-label="Seek">
      <span id="dur" class="time">0:00</span>
    </div>

    <div class="controls">
      <button id="speed" class="btn small-btn" aria-label="Playback speed">1×</button>
      <button id="back" class="btn" aria-label="Back 15 seconds">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><text x="12" y="15.5" font-size="7.5" text-anchor="middle" fill="currentColor" stroke="none" font-family="-apple-system, sans-serif" font-weight="600">15</text></svg>
      </button>
      <button id="play" class="btn big" aria-label="Play">
        <svg id="icon-play" viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" viewBox="0 0 24 24" width="30" height="30" fill="currentColor" hidden><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>
      <button id="fwd" class="btn" aria-label="Forward 30 seconds">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/><text x="12" y="15.5" font-size="7.5" text-anchor="middle" fill="currentColor" stroke="none" font-family="-apple-system, sans-serif" font-weight="600">30</text></svg>
      </button>
      <button id="played" class="btn small-btn" aria-label="Mark played">✓</button>
    </div>
  </section>

  <audio id="audio" preload="metadata" playsinline></audio>
  <script src="app.js"></script>
</body>
</html>
